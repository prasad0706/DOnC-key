version: '3.8'

services:
  backend:
    build: ./backend
    container_name: donk-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    volumes:
      - backend-logs:/app/logs
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    container_name: donk-worker
    restart: unless-stopped
    command: npm run worker
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
      - backend

  redis:
    image: redis:7-alpine
    container_name: donk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  frontend:
    build: ./frontend
    container_name: donk-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-logs:
  redis-data:
